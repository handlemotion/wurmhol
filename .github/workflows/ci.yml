name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # `Checks` is a required status, so the job always runs and reports; docs-only pull requests
      # skip the slow steps below (types, tests, e2e). Format, lint and policies still run.
      - name: Detect docs-only change
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          full=true
          if [ "$EVENT" = "pull_request" ]; then
            other=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -cvE '^docs/|\.md$' || true)
            if [ "$other" = "0" ]; then full=false; fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Run types, tests and e2e: $full"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Format, lint, policies
        run: pnpm check

      # A pull request that changes the published CLI carries a changeset (.changeset/README.md).
      # Release pull requests have consumed theirs: they change packages/cli/CHANGELOG.md instead.
      - name: Changeset
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx packages/cli/CHANGELOG.md; then
            echo "Release pull request: nothing to check"
            exit 0
          fi
          pnpm changeset status --since="$BASE_SHA"

      - name: Types
        if: steps.scope.outputs.full == 'true'
        run: pnpm check-types

      - name: Build site
        if: steps.scope.outputs.full == 'true'
        run: pnpm --filter @wurmhol/site build

      - name: Unit tests
        if: steps.scope.outputs.full == 'true'
        run: pnpm test:all

      # The wall's browser e2e drives Chromium through Playwright (the version in apps/worker).
      - name: Chromium
        if: steps.scope.outputs.full == 'true'
        run: pnpm --filter @wurmhol/worker exec playwright install --with-deps chromium

      # The real stack: wrangler dev (workerd) with local D1 and Durable Objects, the real CLI and
      # a real local HTTP server. Nothing external, so no service containers.
      - name: E2E tests
        if: steps.scope.outputs.full == 'true'
        run: pnpm test:e2e
