name: CI

# `Checks` is the required status. It is a small job that passes only when every job before it
# passed: the static checks, and all e2e shards (or e2e was rightly skipped for a docs-only pull
# request). The work runs in parallel jobs so the e2e suites, the slow part, finish sooner.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether to run the e2e suites. Always on pushes and dispatches. A pull request skips them only
  # when it changes nothing the Worker serves or tests: prose, the docs site, the marketing site.
  scope:
    name: Scope
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect a change that needs no e2e
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          e2e=true
          if [ "$EVENT" = "pull_request" ]; then
            other=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" \
              | grep -cvE '^(docs/|apps/docs/|apps/site/)|\.md$' || true)
            if [ "$other" = "0" ]; then e2e=false; fi
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "Run e2e: $e2e"

  static:
    name: Lint, types, unit
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Format, lint, policies
        run: pnpm check

      # A pull request that changes the published CLI carries a changeset (.changeset/README.md).
      # Release pull requests have consumed theirs: they change packages/cli/CHANGELOG.md instead.
      - name: Changeset
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx packages/cli/CHANGELOG.md; then
            echo "Release pull request: nothing to check"
            exit 0
          fi
          pnpm changeset status --since="$BASE_SHA"

      - name: Types
        run: pnpm check-types

      - name: Build site
        run: pnpm --filter @wurmhol/site build

      - name: Unit tests
        run: pnpm test:all

  # The real stack: wrangler dev (workerd) with local D1 and Durable Objects, the real CLI and a
  # real local HTTP server. Nothing external, so no service containers. Vitest splits the files
  # across shards by a hash of their path; together the shards run every file.
  e2e:
    name: E2E (${{ matrix.shard }}/3)
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Every shard reports, so one push shows every failing file.
      fail-fast: false
      # The shard count is also in the job name and the test command.
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./apps/worker/package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The wall's browser e2e launches headless Chromium, which runs on the headless shell alone.
      # The runner image already has every library it needs; `--with-deps` would only add apt
      # fonts, whose download has taken up to 9 minutes on a slow mirror.
      - name: Chromium
        run: pnpm --filter @wurmhol/worker exec playwright install --only-shell chromium

      - name: E2E tests
        run: pnpm test:e2e -- --shard=${{ matrix.shard }}/3

  checks:
    name: Checks
    needs: [scope, static, e2e]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          SCOPE: ${{ needs.scope.result }}
          STATIC: ${{ needs.static.result }}
          E2E: ${{ needs.e2e.result }}
          RUN_E2E: ${{ needs.scope.outputs.e2e }}
        run: |
          echo "scope: $SCOPE, static: $STATIC, e2e: $E2E (needed: $RUN_E2E)"
          [ "$SCOPE" = success ] || exit 1
          [ "$STATIC" = success ] || exit 1
          if [ "$RUN_E2E" = false ]; then
            [ "$E2E" = skipped ] || exit 1
          else
            [ "$E2E" = success ] || exit 1
          fi
