name: Release

# Keeps one release pull request open while changesets are pending (.changeset/README.md). On each
# push to main, changesets/action runs `changeset version` on the branch `changeset-release/main`
# and opens or updates the pull request "Release wurmhol <version>". It only versions:
# production.yml publishes to npm when that pull request merges.
#
# It uses the workflow's own GITHUB_TOKEN. Events from that token start no workflows, except
# `workflow_dispatch`, so the job then dispatches CI on the release branch: that run reports the
# required `Checks` on the pull request's head commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions: {}

jobs:
  release-pr:
    name: Release pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The action's commit message and title are fixed strings, so the version comes first.
      # Empty when only empty changesets (or none) are pending: nothing to release.
      - name: Next version
        id: next
        run: |
          status="$RUNNER_TEMP/changeset-status.json"
          pnpm changeset status --output="$status"
          version="$(node -p "require(process.argv[1]).releases.find((r) => r.name === 'wurmhol')?.newVersion ?? ''" "$status")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next wurmhol version: ${version:-none}"

      # No publish-script: version-only. Commits go through the GitHub API, signed by GitHub.
      # `changeset version` formats with oxfmt (.changeset/config.json).
      - name: Open or update the release pull request
        id: changesets
        if: steps.next.outputs.version != ''
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          commit-message: Release wurmhol ${{ steps.next.outputs.version }}
          pr-title: Release wurmhol ${{ steps.next.outputs.version }}

      - name: Run Checks on the release pull request
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref changeset-release/main
