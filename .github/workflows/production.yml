name: Production

# What Cloudflare can't do on its own when main changes (Omni's ADR 0019). Workers Builds deploys
# the Worker; this workflow, on each push to main and by hand:
#
# 1. Applies D1 migrations (additive-first schema: nothing waits for them).
# 2. Waits for this commit's Workers Builds check, then syncs Doppler prd_worker to the Worker's
#    secrets with `wrangler secret bulk` (which deploys a new version of the latest one: waiting
#    keeps it from putting the old code back).
# 3. Publishes packages/cli to npm when its version is not on npm yet, through npm trusted
#    publishing (OIDC): no npm token exists. npm links the package to this workflow file. Versions
#    come from Changesets release pull requests (.changeset/README.md); each one released here
#    gets a `wurmhol@<version>` tag and GitHub release with its changelog section.
#
# prd_github arrives as secrets of the GitHub environment `production` (Doppler's GitHub sync).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  migrate:
    name: Migrate D1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @wurmhol/worker

      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        working-directory: apps/worker
        run: |
          node scripts/deploy-cloudflare.mjs --config-only
          pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc

  worker-secrets:
    name: Sync Worker secrets
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @wurmhol/worker

      - name: Wait for Cloudflare's deploy of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/wait-for-checks.sh "$GITHUB_SHA"

      - name: Sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_DOMAIN: ${{ secrets.WORKER_DOMAIN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_WORKER }}
        run: |
          .github/scripts/doppler.sh mask
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          .github/scripts/doppler.sh json > "$secrets_file"
          cd apps/worker
          pnpm exec wrangler secret bulk "$secrets_file"
          rm -f "$secrets_file"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 "https://${WORKER_DOMAIN%%,*}/health"

  publish-cli:
    name: Publish the CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    permissions:
      # The release tag and GitHub release.
      contents: write
      # npm trusted publishing: the OIDC token is the credential, and npm attaches provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter wurmhol...

      # npm accepts a publish minutes before it serves the version, and `npm view` 404s meanwhile.
      # The job waits until npm serves it, so the next run (queued behind this one by the
      # `production` concurrency group) finds it and skips. A run that still lands in that window,
      # such as a re-run after a timeout, gets npm's 409 "previously staged version": the version is
      # already published, so it waits too.
      - name: Publish when the version is new
        working-directory: packages/cli
        run: |
          set -o pipefail
          version="$(node -p 'require("./package.json").version')"
          on_npm() { npm view "wurmhol@$version" version --prefer-online >/dev/null 2>&1; }
          if on_npm; then
            echo "wurmhol@$version is already on npm"
            exit 0
          fi
          # Trusted publishing needs npm 11.5.1 or later.
          npm --version
          pnpm build
          log="$RUNNER_TEMP/npm-publish.log"
          if ! npm publish --access public 2>&1 | tee "$log"; then
            grep -q 'previously staged version' "$log" || exit 1
            echo "An earlier run published wurmhol@$version; npm is still processing it"
          fi
          for _ in $(seq 60); do
            if on_npm; then
              echo "wurmhol@$version is on npm"
              exit 0
            fi
            sleep 15
          done
          echo "::error::npm did not serve wurmhol@$version within 15 minutes of publishing"
          exit 1

      # Re-runs finish a release whose publish succeeded. Versions with no changelog section
      # (the first, published by hand) get no release.
      - name: Tag and GitHub release
        working-directory: packages/cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="wurmhol@$version"
          notes="$(awk -v v="## $version" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md 2>/dev/null || true)"
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "No changelog section for $version: no release"
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "$notes"
          fi
