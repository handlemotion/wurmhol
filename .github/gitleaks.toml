# Gitleaks config for .github/workflows/gitleaks.yml. Default rules plus narrow allowlists for
# known false positives; never allowlist a path wholesale.
[extend]
useDefault = true

[[allowlists]]
description = "Idempotency-Key request headers are random request ids, not credentials"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''(?i)idempotency[-_]key''']

[[allowlists]]
description = "PEM armor in the code that rewraps a GitHub App key as PKCS#8 (ADR 0016): a regex and a template, no key material"
targetRules = ["private-key"]
condition = "AND"
paths = ['''^apps/worker/src/github\.ts$''']
regexTarget = "match"
regexes = ['''\(\[\\s\\S\]\+\?\)''']
