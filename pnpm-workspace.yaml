packages:
  - apps/*
  - packages/*

# Supply-chain guard: never install a version published less than a day ago.
minimumReleaseAge: 1440

allowBuilds:
  bun: true
  esbuild: true
  workerd: true
  sharp: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
